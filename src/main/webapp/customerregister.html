<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Registration | ChefConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    body{
      min-height:100vh;
      background:url('chef2.jpg') no-repeat center center/cover;
      display:flex;justify-content:center;align-items:center;
    }

    .card{
      width:400px;padding:40px 32px;border-radius:20px;
      background:rgba(255,255,255,.25);
      border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(8px);
      box-shadow:0 8px 32px rgba(0,0,0,.25);
      color:#fff;animation:fade .8s ease forwards;
      transform:translateY(40px);opacity:0;
    }
    @keyframes fade{to{transform:translateY(0);opacity:1;}}

    h2{text-align:center;margin-bottom:28px;font-weight:600;}

    label{display:block;font-size:.9rem;margin-top:10px;}
    input,textarea{
      width:100%;padding:12px 14px;margin-top:6px;margin-bottom:14px;
      border-radius:12px;border:1px solid rgba(255,255,255,.35);
      background:rgba(255,255,255,.3);color:#fff;font-size:.9rem;
    }
    textarea{resize:vertical;min-height:80px;}
    input::placeholder,textarea::placeholder{color:#eee;}

    button{
      width:100%;padding:12px;background:#38bdf8;border:none;
      border-radius:14px;color:#0f172a;font-weight:600;font-size:1rem;
      cursor:pointer;transition:.25s;
    }
    button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2);}

    .login-link{text-align:center;margin-top:18px;font-size:.85rem;}
    .login-link a{color:#fff;font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor;}
    .login-link a:hover{color:#38bdf8;}
  </style>
</head>
<body>

  <div class="card">
    <h2>Create Customer Account</h2>
    
    <form action="customerregister" method="POST">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="contact">Contact</label>
      <input type="tel" id="contact" name="contact" placeholder="Mobile number" required>

      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Street, City, ZIP" required></textarea>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">Register as Customer</button>
      
    </form>

    <div class="login-link">
      Already have an account? <a href="Login.html">Login here</a>
    </div>
  </div>

</body>
</html>
